<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffd700" />
    <title>Domus offline</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --yellow: #ffd700;
        --red: #d83900;
        --ink: #1a1c1c;
        --muted: #665f4d;
        --surface: #f9f9f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--surface);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }

      main {
        width: min(460px, 100%);
        padding: 28px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 16px 50px rgba(64, 43, 20, 0.12);
      }

      .logo {
        width: 76px;
        height: 48px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 10px;
        background: white;
        color: var(--red);
        box-shadow: inset 0 -4px 0 var(--yellow), 0 8px 24px rgba(0, 0, 0, 0.08);
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.55;
      }

      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 18px;
        background: var(--red);
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Domus</div>
      <h1>Voce esta offline.</h1>
      <p>
        O app Domus foi salvo no dispositivo. Quando a conexao voltar, os produtos e imagens
        online serao atualizados automaticamente.
      </p>
      <a href="./index.html">Voltar ao app</a>
    </main>
  </body>
</html>
