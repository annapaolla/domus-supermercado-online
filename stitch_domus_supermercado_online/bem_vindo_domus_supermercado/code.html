<div class="absolute bottom-[-5%] left-[-5%] w-[250px] h-[250px] bg-secondary-container rounded-full blur-3xl opacity-10"></div>
<!-- Hero Content Section -->
<div class="w-full flex-grow flex flex-col items-center justify-center px-gutter pt-stack-lg max-w-container-max mx-auto relative z-10">
<!-- Branding -->
<div class="mb-stack-lg flex flex-col items-center">
<div class="w-32 h-32 md:w-40 md:h-40 bg-white rounded-[2rem] shadow-xl p-4 flex items-center justify-center mb-6">
<img class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujAkHSZUcV27MbTE-Sb7uLV0IZDKJQuFkIO--_B0KkhmtFCgS5gDd4O3c2LJlLNziVO8Le0HKyy5zFMayhTdlVyO1rbrhanonshkpwmHaJilrRWv5KPS03_cVRSflFohDHC9wO6Imn-xAZduA2s9NHqpqBON2uc4JD7N5_JW3sphFqhH5i1NwFCAopHKy-gbG48tLh2t_Rj5n2jyO0M_48dDezUjN0C8WRDx6iB0qycUMagszqYY9nGbosoRqA6McW4cPC4mC9JLw"/>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface text-center mb-2">
                    Domus <span class="text-secondary">Supermercado</span>
</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center max-w-[320px]">
                    O vizinho prestativo que leva o melhor da feira direto para sua casa.
                </p>
</div>
<!-- Visual Feature (Bento Card Style) -->
<div class="grid grid-cols-2 gap-stack-md w-full max-w-md mt-4">
<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-tertiary text-3xl mb-2">local_shipping</span>
<span class="font-label-bold text-label-bold">Entrega Rápida</span>
</div>
<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-secondary text-3xl mb-2">eco</span>
<span class="font-label-bold text-label-bold">Produtos Frescos</span>
</div>
</div>
</div>
<!-- Action Section -->
<div class="w-full bg-surface-container-lowest rounded-t-[3rem] px-gutter py-stack-lg shadow-[0_-8px_30px_rgba(0,0,0,0.04)] relative z-20 max-w-container-max mx-auto lg:rounded-[3rem] lg:mb-gutter">
<div class="flex flex-col gap-4 max-w-md mx-auto">
<!-- Primary Actions -->
<button class="w-full bg-secondary text-on-secondary font-headline-md text-headline-md py-4 rounded-xl shadow-lg shadow-secondary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                    Entrar
                    <span class="material-symbols-outlined">login</span>
</button>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2">
                    Criar Conta
                    <span class="material-symbols-outlined">person_add</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="text-on-surface-variant font-label-bold text-sm">ou</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Secondary Actions -->
<button class="w-full py-3 px-6 rounded-xl border-2 border-outline-variant text-on-surface font-label-bold flex items-center justify-center gap-2 hover:bg-surface-container transition-colors">
                    Continuar como convidado
                    <span class="material-symbols-outlined">chevron_right</span>
</button>
<button class="w-full py-2 text-tertiary font-label-bold hover:underline transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">sell</span>

                </button>
</div>

<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Compra Segura</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm">support_agent</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Suporte 24h</span>
</div>
