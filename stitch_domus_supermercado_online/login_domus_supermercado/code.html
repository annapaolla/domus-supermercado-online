<body class="flex flex-col min-h-screen text-on-background">
<header class="w-full flex items-center justify-center py-stack-lg">

</div>

<div class="mb-stack-lg text-center md:text-left">

<p class="font-body-md text-body-md text-on-surface-variant">Acesse sua conta para continuar suas compras.</p>
</div>
<form class="space-y-gutter">
<div class="space-y-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface ml-1" for="email">E-mail</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-transparent focus:border-secondary focus:ring-0 rounded-2xl font-body-md transition-all outline-none" id="email" placeholder="nome@exemplo.com" required="" type="email"/>
</div>
</div>
<div class="space-y-stack-sm">
<div class="flex justify-between items-center px-1">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Senha</label>
<a class="font-label-bold text-label-bold text-secondary hover:underline transition-all" href="#">Esqueci minha senha</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-transparent focus:border-secondary focus:ring-0 rounded-2xl font-body-md transition-all outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<button class="w-full py-4 bg-secondary text-white font-headline-md text-[18px] rounded-2xl shadow-lg shadow-secondary/20 hover:scale-[1.01] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Entrar
                </button>
</form>
<div class="mt-gutter flex items-center gap-base">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="font-label-bold text-label-bold text-outline uppercase tracking-wider text-[10px]">Ou entre com</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<div class="mt-gutter grid grid-cols-2 gap-stack-md">

</button>
